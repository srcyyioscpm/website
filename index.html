<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srcyyz CPM Server Dashboard🔥</title>
<style>
  :root {
    --bg-color: #0b0e14;
    --card-bg: #151a23;
    --card-border: #232a36;
    --accent: #3b82f6;
    --text-main: #f3f4f6;
    --text-sub: #9ca3af;
    --danger: #ef4444;
    --warning: #eab308;
    --purple: #a855f7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 850px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .status { font-size: 12px; color: #10b981; }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sub); margin-bottom: 16px; }

  .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input, button { background: #0b0e14; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 13px; outline: none; }
  button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; }
  button:active { opacity: 0.8; }
  .btn-danger { background: var(--danger); padding: 6px 10px; font-size: 11px; }
  .btn-warning { background: var(--warning); color: #000; padding: 6px 10px; font-size: 11px; font-weight: 700; }
  .btn-purple { background: var(--purple); color: #fff; padding: 6px 10px; font-size: 11px; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: left; }
  th { color: var(--text-sub); padding: 10px; border-bottom: 1px solid var(--card-border); font-weight: 600; }
  td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

  .badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block; }
  .badge-unused { background: rgba(234, 179, 8, 0.15); color: var(--warning); border: 1px solid rgba(234, 179, 8, 0.3); }
  .badge-used { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge-paused { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

  .actions-cell { display: flex; gap: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>Srcyyz CPM Server Dashboard🔥</h1>
  <div class="status">● Cloudflare Backend Online</div>
</div>

<div class="card">
  <div class="card-title">Admin Authentication</div>
  <div class="form-group">
    <input type="password" id="adminPassInput" placeholder="Enter Admin Secret Key" style="flex:1;">
    <button onclick="saveAdminPass()">Save Password</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Generate License Keys</div>
  <div class="form-group">
    <input type="number" id="customTimeVal" placeholder="Duration" value="30" style="width: 90px;" min="1">
    <select id="customTimeUnit">
      <option value="days">Days</option>
      <option value="hours">Hours</option>
    </select>
    <input type="text" id="customPrefix" placeholder="Custom Prefix (Optional)" value="SRCYY">
    <button onclick="handleGenerateKey()">Generate Key</button>
  </div>
</div>

<div class="card">
  <div class="card-title">License Keys Database</div>
  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Duration</th>
        <th>Status</th>
        <th>HWID / Device</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="keyTableBody">
      <tr><td colspan="5" style="text-align:center; color: var(--text-sub);">Loading database...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const AUTH_API_URL = "https://mute-water-fd47.bookingotbfern.workers.dev/";

  function getAdminPass() {
    return localStorage.getItem("cpm_admin_pass") || "";
  }

  function saveAdminPass() {
    const val = document.getElementById("adminPassInput").value.trim();
    localStorage.setItem("cpm_admin_pass", val);
    alert("Admin password saved!");
    loadKeysFromCloudflare();
  }

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("adminPassInput").value = getAdminPass();
    loadKeysFromCloudflare();
  });

  async function loadKeysFromCloudflare() {
    const pass = getAdminPass();
    try {
      const res = await fetch(`${AUTH_API_URL}?api=list&admin_key=${encodeURIComponent(pass)}`);
      const data = await res.json();
      
      if (data.error === "Unauthorized") {
        document.getElementById("keyTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--danger);">Unauthorized. Enter valid admin password.</td></tr>`;
        return;
      }

      renderKeyTable(data);
    } catch (e) {
      console.error("Error loading keys:", e);
    }
  }

  function renderKeyTable(keys) {
    const tbody = document.getElementById("keyTableBody");
    tbody.innerHTML = "";

    if (!keys || keys.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-sub);">No keys found.</td></tr>`;
      return;
    }

    keys.forEach(k => {
      const tr = document.createElement("tr");
      
      let statusBadge = k.used 
        ? `<span class="badge badge-used">Used</span>` 
        : `<span class="badge badge-unused">Unused</span>`;
      
      if (k.paused) {
        statusBadge = `<span class="badge badge-paused">Paused</span>`;
      }
      
      const hwidDisplay = k.hwid ? k.hwid : "None";
      const pauseBtnText = k.paused ? "Unpause" : "Pause";
      
      const durationDisplay = k.durationDisplay || `${k.days} Days`;

      tr.innerHTML = `
        <td style="font-family: monospace; font-weight:600;">${k.key}</td>
        <td>${durationDisplay}</td>
        <td>${statusBadge}</td>
        <td style="font-family: monospace; color: var(--text-sub); word-break: break-all;">${hwidDisplay}</td>
        <td class="actions-cell">
          <button class="btn-purple" onclick="togglePauseCloudflare('${k.key}')">${pauseBtnText}</button>
          <button class="btn-warning" onclick="resetHwidCloudflare('${k.key}')">Reset HWID</button>
          <button class="btn-danger" onclick="deleteKeyCloudflare('${k.key}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function handleGenerateKey() {
    const pass = getAdminPass();
    const prefix = document.getElementById("customPrefix").value.trim() || "SRCYY";
    const timeVal = parseFloat(document.getElementById("customTimeVal").value) || 1;
    const timeUnit = document.getElementById("customTimeUnit").value;
    
    // Calculate fractional days for Cloudflare KV storage
    const days = timeUnit === "hours" ? (timeVal / 24) : timeVal;
    const durationLabel = `${timeVal} ${timeUnit.charAt(0).toUpperCase() + timeUnit.slice(1)}`;

    const randomPart = Array.from({length: 3}, () => Math.random().toString(36).substring(2, 6).toUpperCase()).join('-');
    const newKey = `${prefix}-${randomPart}`;
    
    await fetch(`${AUTH_API_URL}?api=add&key=${newKey}&days=${days}&label=${encodeURIComponent(durationLabel)}&admin_key=${encodeURIComponent(pass)}`);
    loadKeysFromCloudflare();
  }

  async function togglePauseCloudflare(key) {
    const pass = getAdminPass();
    await fetch(`${AUTH_API_URL}?api=togglepause&key=${encodeURIComponent(key)}&admin_key=${encodeURIComponent(pass)}`);
    loadKeysFromCloudflare();
  }

  async function resetHwidCloudflare(key) {
    if (!confirm(`Reset HWID for key ${key}?`)) return;
    const pass = getAdminPass();
    await fetch(`${AUTH_API_URL}?api=resethwid&key=${encodeURIComponent(key)}&admin_key=${encodeURIComponent(pass)}`);
    loadKeysFromCloudflare();
  }

  async function deleteKeyCloudflare(key) {
    if (!confirm(`Delete key ${key}?`)) return;
    const pass = getAdminPass();
    await fetch(`${AUTH_API_URL}?api=delete&key=${encodeURIComponent(key)}&admin_key=${encodeURIComponent(pass)}`);
    loadKeysFromCloudflare();
  }
</script>

</body>
</html>
